<!-- templates/index.html -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Access Grid — Simulator</title>
  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding: 20px; max-width: 1000px; margin: auto; font-family: system-ui,Segoe UI,Roboto,Arial; }
    textarea { font-family: monospace; }
  </style>
</head>
<body>
  <h1 class="mb-3">Access Grid — Simulator</h1>

  <div class="mb-3">
    <button id="loadDefault" class="btn btn-secondary">Load Default JSON</button>
    <button id="simulate" class="btn btn-primary">Simulate Access</button>
    <button id="clear" class="btn btn-outline-secondary">Clear</button>
  </div>

  <label for="inputJson" class="form-label">Employee Input (JSON)</label>
  <textarea id="inputJson" class="form-control mb-3" rows="8"></textarea>

  <h4>Simulation Results</h4>
  <div id="resultsArea"></div>

<script>
const defaultData = [
  { "id": "EMP001", "access_level": 2, "request_time": "09:15", "room": "ServerRoom" },
  { "id": "EMP002", "access_level": 1, "request_time": "09:30", "room": "Vault" },
  { "id": "EMP003", "access_level": 3, "request_time": "10:05", "room": "ServerRoom" },
  { "id": "EMP004", "access_level": 3, "request_time": "09:45", "room": "Vault" },
  { "id": "EMP005", "access_level": 2, "request_time": "08:50", "room": "R&D Lab" },
  { "id": "EMP006", "access_level": 1, "request_time": "10:10", "room": "R&D Lab" },
  { "id": "EMP007", "access_level": 2, "request_time": "10:18", "room": "ServerRoom" },
  { "id": "EMP008", "access_level": 3, "request_time": "09:55", "room": "Vault" },
  { "id": "EMP001", "access_level": 2, "request_time": "09:28", "room": "ServerRoom" },
  { "id": "EMP006", "access_level": 1, "request_time": "10:15", "room": "R&D Lab" }
];

document.getElementById('loadDefault').addEventListener('click', () => {
  document.getElementById('inputJson').value = JSON.stringify(defaultData, null, 2);
});

document.getElementById('clear').addEventListener('click', () => {
  document.getElementById('inputJson').value = '';
  document.getElementById('resultsArea').innerHTML = '';
});

document.getElementById('simulate').addEventListener('click', async () => {
  const txt = document.getElementById('inputJson').value.trim();
  let data;
  try {
    data = txt ? JSON.parse(txt) : [];
  } catch (err) {
    alert('Invalid JSON: ' + err.message);
    return;
  }

  // send to backend
  try {
    const resp = await fetch('/simulate/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    if (!resp.ok) {
      const err = await resp.json();
      document.getElementById('resultsArea').innerText = 'Error: ' + JSON.stringify(err);
      return;
    }
    const results = await resp.json();
    renderResults(results);
  } catch (e) {
    document.getElementById('resultsArea').innerText = 'Network error: ' + e.message;
  }
});

function renderResults(results) {
  let html = '<table class="table table-bordered"><thead><tr><th>#</th><th>ID</th><th>Room</th><th>Time</th><th>Result</th><th>Reason</th></tr></thead><tbody>';
  results.forEach((r, i) => {
    const cls = r.granted ? 'table-success' : 'table-danger';
    html += `<tr class="${cls}"><td>${i+1}</td><td>${r.id}</td><td>${r.room}</td><td>${r.time}</td><td>${r.granted ? 'Granted' : 'Denied'}</td><td>${r.reason}</td></tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('resultsArea').innerHTML = html;
}

// auto-load default on first open
document.getElementById('loadDefault').click();
</script>
</body>
</html>
